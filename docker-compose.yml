# goduck-platform 本地开发基础设施。
# 所有凭据走 ${VAR:-默认值} 内联默认值：克隆后直接 `docker-compose up -d` 即可，
# 无需任何 .env 即开箱可用；如需自定义，在同目录建 .env 覆盖对应变量。
#
# NOTE: backend / mcp 网关在开发期仍本地运行（uvicorn / python main.py）。
# 待 MCP stdio 稳定后再考虑容器化后端。

services:
  postgres:
    image: postgres:16-alpine
    container_name: goduck-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-goduck}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-langgraph_db}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - goduck_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-goduck} -d ${POSTGRES_DB:-langgraph_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # 附件字节持久层（图片 / 文档）。bucket 由后端启动时自动创建（见 storage.py）。
    image: minio/minio:latest
    container_name: goduck-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - goduck_miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  goduck_pgdata:
  goduck_miniodata:
