# goduck-platform 一体化部署（单文件，直观易改）。
#
# GPU 支持已内置声明（backend 的 docling/torch 峰值 ~3-4G 显存 + tei ~1.5-2G +
# laya ~1G，共占单卡；参考配置 Linux + 32G 内存 + RTX 3080 10G 实测），一条命令拉起全部：
#   docker compose up -d --build
# 浏览器访问：      http://<服务器IP>   （nginx 唯一对外入口 :80）
# 凭据自定义：      同目录建 .env 覆盖 ${VAR:-默认值}
#
# GPU 前置（一次性）：NVIDIA 驱动 ≥550（推荐 570 系）+ NVIDIA Container Toolkit：
#   sudo nvidia-ctk runtime configure --runtime=docker && sudo systemctl restart docker
# 防呆：未装工具包/驱动时 backend / tei / laya 起不来（"could not select device
#   driver nvidia"）——属预期失败。临时在无 GPU 机器跑：注释 backend/tei/laya
#   三处 deploy 段 + .env 置 KB_DOCLING_DEVICE=auto、TEI_IMAGE=cpu-1.9、
#   LAYA_DEVICE=cpu，laya 镜像另按 CPU 矩阵重建（改 laya/Dockerfile 的
#   TORCH_VERSION / TORCH_INDEX_URL 两个 ARG，同 backend 升级只改 ARG）。
#
# 架构：所有服务共享 compose 默认网络，按"服务名"互访（无需显式 networks）。
#       仅 nginx 发布 :80（唯一入口）；backend/frontend 不对
#       宿主发布，经 nginx 转发；postgres/minio/es/tei/laya 的 ports 均绑定
#       127.0.0.1（仅本机调试，LAN 不可见）——缺省即生产安全，无需删改。

services:
  # ============ 基础设施 ============
  postgres:
    image: postgres:16-alpine
    container_name: goduck-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-goduck}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-langgraph_db}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"      # 仅本机调试（127.0.0.1 绑定，LAN 不可见）
    volumes:
      - goduck_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-goduck} -d ${POSTGRES_DB:-langgraph_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    # 附件字节持久层（图片/文档）。bucket 由后端启动时自动创建。
    image: minio/minio:latest
    container_name: goduck-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"         # 仅本机调试（127.0.0.1 绑定，LAN 不可见）
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - goduck_miniodata:/data
    restart: unless-stopped

  elasticsearch:
    # 知识库（RAG）向量/全文检索存储。single-node dev；生产请开启 xpack.security 并配 ES_USER/ES_PASSWORD。
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.0
    container_name: goduck-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"          # dev：关闭安全
      ES_JAVA_OPTS: "-Xms2g -Xmx2g"            # 堆 2g（KB 检索/入库宽裕）；按机器调整
    ports:
      - "127.0.0.1:${ES_PORT:-9200}:9200"            # 仅本机调试（127.0.0.1 绑定，LAN 不可见）
    volumes:
      - goduck_esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  tei:
    # 文本嵌入推理（TEI）——知识库 RAG 向量化引擎（OpenAI 兼容 /v1/embeddings）。
    # 与其余服务同机同网部署，backend 按服务名直连（EMBEDDING_BASE_URL 见 backend 段）。
    # 镜像：cuda-1.9 = CUDA 多目标镜像（入口脚本按 GPU compute capability 自动
    # 分发二进制，RTX 3080/sm_86 → Ampere/Ada 版 + flash-attn v2；镜像含
    # cuda-compat，宿主机驱动 ≥550 即可用）。版本升级 / 换硬件：.env 覆盖
    # TEI_IMAGE（CPU 机器用 cpu-1.9）/ TEI_MODEL_ID 即可。
    image: ghcr.io/huggingface/text-embeddings-inference:${TEI_IMAGE:-cuda-1.9}
    container_name: goduck-tei
    # 模型对齐 EMBEDDING_DIMS=512：Qwen3-Embedding-0.6B 原生 1024 维，由 OpenAI
    # 兼容端点按请求的 dimensions 参数做 MRL 截断（换模型须同步核对维度）。
    # --model-id 默认指向容器内本地目录 /data/Qwen3-Embedding-0.6B（bind mount
    # 自宿主机 volumes/tei/）：TEI 判定路径存在即本地加载，运行期零联网；覆盖
    # TEI_MODEL_ID 为 HF repo id 则首启经 hub 下载（缓存落同卷，之后离线复用）。
    # --port 8082：沿用既有端口约定（backend EMBEDDING_BASE_URL / 宿主调试口同源）。
    # 批参数防"单请求多轮前向、延迟成倍放大"陷阱（见 README FAQ）：
    #   --max-client-batch-size 32 ≥ EMBEDDING_BATCH_SIZE(24)：单请求文本数上限（超则 422）
    #   --max-batch-tokens 32768 ≥ 24 条 × ~1k token/条：单批一轮前向完成，不再轮转
    command: >-
      --model-id ${TEI_MODEL_ID:-/data/Qwen3-Embedding-0.6B}
      --port 8082
      --max-client-batch-size 32
      --max-batch-tokens 32768
    environment:
      # 向容器注入的驱动能力：compute=CUDA 计算，utility=nvidia-smi（观测用）
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      # HF hub 端点：仅 TEI_MODEL_ID 为 repo id 时走下载路径（本地目录加载零联网）。
      # 默认国内镜像 hf-mirror.com（免梯子），海外/有代理可 .env 覆盖回官方源。
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
    ports:
      - "127.0.0.1:${TEI_PORT:-8082}:8082"      # 仅本机调试（本地直跑后端可用；LAN 不可见）
    volumes:
      # 模型目录（bind mount → 宿主机 ${VOLUMES_ROOT:-./volumes}/tei/）。预下命令见
      # README「内置 TEI 嵌入服务」（HF 默认走上方 HF_ENDPOINT 镜像，或魔搭直下）。
      - ${VOLUMES_ROOT:-./volumes}/tei:/data
    healthcheck:
      # /health：就绪（模型加载完成）才转 healthy；镜像自带 curl。
      test: ["CMD", "curl", "-fs", "http://localhost:8082/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        reservations:
          devices:
            # 与 backend 共占单卡：0.6B fp16 权重 ≈1.2G + 批激活 ≈ 显存 1.5-2G，
            # 并发 docling 解析 + 入库时留意 nvidia-smi 水位。
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  # ============ Laya 判决服务（Jev 协议兼容端点）============
  laya:
    # System 1 判决模型（Apache 2.0 开源权重，TypeSafe Jev 的自托管替代）：
    # laya-serve 暴露 POST /v1/systemone，与 Jev wire 协议逐字段兼容——backend
    # 的 JevClient 仅改 base_url 即接入（见 backend 段 JEV_BASE_URL）。
    # 安装矩阵沿用 backend（slim + cu124 torch，驱动门槛 ≥550/570 系一致）。
    # 安装矩阵（slim + cu124 torch + 国内回退源）固化在 laya/Dockerfile 的 ARG，
    # 与 backend 同款：升级/换矩阵只改 Dockerfile，不在 yml 声明。
    build: ./laya
    image: goduck-laya:latest
    container_name: goduck-laya
    environment:
      # 本地权重经 LAYA_EXTRA_MODELS 注册（0.4.38 serve 层原生机制：
      # {name: 本地目录}，同名重指向内置 multilingual alias——官方镜像
      # entrypoint 的 LAYA_MODEL_PATH 即此翻译；精简镜像直跑 laya-serve 须
      # 显式使用）。单 checkpoint 常驻：LAYA_MODELS 只预载 multilingual
      # （显存纪律），无语言证据的 state 回落 LAYA_DEFAULT_MODEL。
      LAYA_EXTRA_MODELS: '{"multilingual":"/models/laya/laya-multilingual"}'
      LAYA_MODELS: multilingual
      LAYA_DEFAULT_MODEL: multilingual
      # 推理设备：生产默认显式锁 cuda（容器能起 = 设备声明已过，cuda 必然
      # 可用，同 KB_DOCLING_DEVICE 语义）；无 GPU 机器 .env 覆盖回 cpu。
      LAYA_DEVICE: ${LAYA_DEVICE:-cuda}
      # 精度 fp16（bf16 实测翻 3/864 argmax，fp16 为 0；计算能力 <8 的卡两种
      # 拼写都会强制 fp16）。
      LAYA_CUDA_AMP: ${LAYA_CUDA_AMP:-fp16}
      # 启动即装载权重（免首请求数秒冷启动）；preload 完成才开始监听。
      LAYA_PRELOAD: "1"
      # 运行期离线纪律：模型经 bind mount 预置，运行期零联网（对齐 docling/tei）。
      HF_HUB_OFFLINE: "1"
      # 认证与 backend 共用一把钥匙：设 TYPESAFE_API_KEY 后 laya-serve 强制
      # Bearer 校验，backend 的 Jev 客户端用同值直连；空 = 无认证（仅 compose
      # 内网 + 127.0.0.1 调试口可达）。
      LAYA_API_KEY: ${TYPESAFE_API_KEY:-}
      # 严格 Jev wire 契约（剥离 routing/action 附加字段），与 backend 的
      # langchain-typesafe 客户端解析面严格对齐。
      LAYA_JEV_STRICT: "1"
      # 单请求 max_len/head_max_len 上限（multilingual 默认上下文 1024，长文
      # 需随请求扩到 8192，受本值约束）。
      LAYA_MAX_TOKEN_BUDGET: ${LAYA_MAX_TOKEN_BUDGET:-8192}
      # 供应链门禁：权重解析前校验 SHA-256，不匹配拒绝装载。值为 pin commit
      # e4e9ddf2（官方 revisions.py 审阅 SHA）的实测摘要；重下/换版后按实测
      # 更新或清空。
      LAYA_SHA256_DIGESTS: '{"model.safetensors":"9d628fd971b700382ac6f65920a86f149777b2e748e0c955fb3b19695aa8f204","tokenizer/tokenizer.json":"609d8f4c067cd3950f88594c5a802616cea245823836ef5848ee4fc40aab5b6f"}'
      # CPU 线程数（无 GPU 回落 cpu 时生效）。
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-4}
      # 向容器注入的驱动能力：compute=CUDA 计算，utility=nvidia-smi（观测用）
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    expose: ["8000"]                       # 仅内部网络可见（backend 经服务名直连）
    ports:
      - "127.0.0.1:${LAYA_PORT:-8000}:8000"         # 仅本机调试（冒烟/直连验证）
    volumes:
      # 模型目录（bind mount → 宿主机 ${VOLUMES_ROOT:-./volumes}/laya/）。预下
      # runbook（部署目录执行；pin = 官方审阅 SHA，核心 ~647MiB）：
      #   mkdir -p volumes/laya/laya-multilingual
      #   HF_ENDPOINT=https://hf-mirror.com huggingface-cli download \
      #     convaiinnovations/laya-multilingual \
      #     --revision e4e9ddf21a7b1903b7acffd8814ad4307bf63a67 \
      #     --local-dir volumes/laya/laya-multilingual
      #   sudo chown -R 10001:10001 volumes/laya
      #     # loader 首次加载可能改写 tokenizer 配置，目录须 UID 10001 可写
      - ${VOLUMES_ROOT:-./volumes}/laya:/models/laya
    healthcheck:
      # /health 无认证（设 LAYA_API_KEY 亦然）；slim 镜像无 curl，用 python
      # 标准库探活。preload=1 下 healthy 即权重已驻留。
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      # 权重装载（~647MiB）+ CUDA 初始化的宽限
      start_period: 120s
    restart: unless-stopped
    # GPU 声明（与 backend/tei 共占单卡）：multilingual 322M fp16 权重 ~0.65G
    # + 前向激活，单 checkpoint 常驻 ~1G；并发 docling 解析时留意 nvidia-smi 水位。
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ============ 后端 ============
  backend:
    build: ./backend
    image: goduck-backend:latest
    container_name: goduck-backend
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      # 登录认证：引导用户（create-if-absent，'用户名:昵称:角色:密码' 逗号分隔）。
      # 密码仅首次建户生效；改密走平台内个人中心。生产至少引导一个 manager。
      BOOTSTRAP_USERS: ${BOOTSTRAP_USERS:-}
      AUTH_SESSION_TTL_HOURS: ${AUTH_SESSION_TTL_HOURS:-168}
      # 本地文件根：workspace/memories/skills 三目录均派生自它（见 app/config.py）。
      # 挂载命名卷到 /data，使三者持久化、跨重打镜像不丢。
      LOCAL_ROOT: ${LOCAL_ROOT:-/data}
      # nginx 剥 /api，让 docs/openapi.json 链接正确（本地直连留空）
      ROOT_PATH: ${ROOT_PATH:-/api}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # 容器间走服务名 + 内部端口
      DATABASE_URL: postgresql://${POSTGRES_USER:-goduck}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-langgraph_db}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-10}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_BUCKET: ${MINIO_BUCKET:-uploads}
      MINIO_SECURE: "false"
      # 附件/KB 文档上传上限（MB）：会话附件与知识库文档共用（nginx 边缘
      # client_max_body_size 须 ≥ 此值）。本地默认 10，生产 .env 按需调大。
      ATTACHMENT_MAX_SIZE_MB: ${ATTACHMENT_MAX_SIZE_MB:-10}
      # 预签名 URL 相对化（true = /minio/<bucket>/<key>?sig，配合下方 nginx /minio/
      # 同源代理；本地 dev 直连 MinIO 保持默认 false 绝对 URL）
      MINIO_RELATIVE_PRESIGN: ${MINIO_RELATIVE_PRESIGN:-true}
      MCP_ALLOW_LOOPBACK: "true"
      MAX_INVOKE_RETRIES: ${MAX_INVOKE_RETRIES:-2}
      # ---- 知识库（RAG）----
      # 向量模型注册化：本组 EMBEDDING_* = 启动 seed 默认行取值源 + 未绑定库回落
      # （主路径 /settings/embeddings 注册，建库绑定）。
      # TEI 已内置 compose（上方 tei 服务）：默认服务名直连；改用外部嵌入端点时
      # .env 覆盖本值（backend 懒连接嵌入端点，故不设 tei 的 depends_on）。
      ES_URL: http://elasticsearch:9200
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://tei:8082/v1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-dummy}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embeddings-inference}
      EMBEDDING_CHECK_CTX_LENGTH: ${EMBEDDING_CHECK_CTX_LENGTH:-false}
      EMBEDDING_DIMS: ${EMBEDDING_DIMS:-512}
      EMBEDDING_SEED_NAME: ${EMBEDDING_SEED_NAME:-Qwen3-Embedding-0.6B（TRL 512）}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-24}
      KB_ENABLED: ${KB_ENABLED:-true}
      KB_STORE_MINIO: ${KB_STORE_MINIO:-true}
      # ---- 知识库 docling 解析引擎（plan: kb-docling-parse-display）----
      # legacy（默认）零依赖；切 docling 前必须先做模型卷预热（见下方注释 runbook）。
      KB_PARSER_ENGINE: ${KB_PARSER_ENGINE:-legacy}
      KB_DOCLING_SHARD_PAGES: ${KB_DOCLING_SHARD_PAGES:-100}
      KB_DOCLING_THREADS: ${KB_DOCLING_THREADS:-4}
      # 推理设备 auto/cpu/cuda/mps。GPU 已内置 compose（下方 deploy 设备声明），
      # 默认显式锁 cuda（容器能起 = 设备声明已过，cuda 必然可用；不想硬锁可
      # .env 覆盖回 auto——按 torch 探测，缺卡回落 cpu）。
      KB_DOCLING_DEVICE: ${KB_DOCLING_DEVICE:-cuda}
      # 向容器注入的驱动能力：compute=CUDA 计算，utility=nvidia-smi（观测用）
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      KB_UNIT_MAX_CHARS: ${KB_UNIT_MAX_CHARS:-2000}
      # 权重目录 = 命名卷内 artifacts/（<org--repo> 子目录布局，docling 缺件
      # 即 FileNotFoundError 显式失败，绝不运行时下载）；HF_HOME 指向同卷
      # hf-cache/ 兜住经 huggingface_hub 运行时加载的模型（layout 骨干等）。
      # HF_HUB_OFFLINE 默认 1：离线纪律——预热期显式置 0 放行下载。
      # 简化模式（免 artifacts 预热）：.env 置 KB_DOCLING_ARTIFACTS_PATH=（空，
      # 注意用 `-` 形式才能区分"空"与"未设"）+ HF_HUB_OFFLINE=0 → 首次 docling
      # 解析时模型经 HF hub 下载进卷内 hf-cache/，之后复用；稳定后可切回 1。
      KB_DOCLING_ARTIFACTS_PATH: ${KB_DOCLING_ARTIFACTS_PATH-/models/docling/artifacts}
      HF_HOME: ${HF_HOME:-/models/docling/hf-cache}
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-1}
      # HF hub 端点：预热（HF_HUB_OFFLINE=0 放行时）与简化模式兜底下载经
      # huggingface_hub / docling-tools，均读此变量。默认国内镜像 hf-mirror.com
      # （免梯子直连），海外/有代理可 .env 覆盖回 https://huggingface.co。
      # RapidOCR 权重本就源自 ModelScope（modelscope.cn 直连），与此开关无关。
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
      # ---- 语音输入（STT 触发会话，AssemblyAI Streaming）----
      # key 缺省为空 → 后端降级：voice 路由不挂载、健康能力位 false（前端无麦克风入口）。
      VOICE_ENABLED: ${VOICE_ENABLED:-false}
      ASSEMBLYAI_API_KEY: ${ASSEMBLYAI_API_KEY:-}
      # ---- Jev 守卫（allow_shell HITL 减负；判决后端 = 内置 laya-serve，Jev wire 协议；默认关）----
      # .env 置 JEV_ENABLED=true + TYPESAFE_API_KEY（与上方 LAYA_API_KEY 同值）后重启
      # 生效；key 缺失自动回落全人工审批（启动警告不崩）。laya 停摆按 fail-closed
      # 回落人工审批（与 tei 同理不设 depends_on，JevClient 懒连接）。
      JEV_ENABLED: ${JEV_ENABLED:-false}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      # 端点根：compose 内置 laya-serve（Jev 协议兼容端点 POST /v1/systemone）。
      JEV_BASE_URL: ${JEV_BASE_URL:-http://laya:8000}
      # 模型名须为 laya 侧注册名（LAYA_EXTRA_MODELS 同名注册）。
      JEV_MODEL: ${JEV_MODEL:-multilingual}
      # enforce：灰区自动放行生效（L1 确定性层先行减负；laya 置信轴未校准时
      # 灰区自然回落人工）；shadow=只判只落审计，行为与现状一致。
      JEV_MODE: ${JEV_MODE:-enforce}
      # L2 自动放行阈值 T（P 与 conf 双轴同值）：调低=放行面更宽、反向否决线
      # 前移（touches_system / installs_packages 更易否决）。变更随图构建烘焙
      # （重启后端或等 registry TTL 过期再生效）。
      JEV_SAFE_THRESHOLD: ${JEV_SAFE_THRESHOLD:-0.45}
      JEV_RUBRIC_ENABLED: ${JEV_RUBRIC_ENABLED:-false}
      JEV_KB_RERANK_ENABLED: ${JEV_KB_RERANK_ENABLED:-false}
      # L1 允许项扩展：在册 MCP 前置依赖补齐 + 工作区常规操作零审批直通
      # （mcp_server 表登记包 + JEV_SHELL_ALLOW_PKGS 并集）；false=一键回退。
      # 变更随图构建烘焙（重启后端或等 registry TTL 过期再生效）。
      JEV_SHELL_L1_ALLOW: ${JEV_SHELL_L1_ALLOW:-true}
      JEV_SHELL_ALLOW_PKGS: ${JEV_SHELL_ALLOW_PKGS:-}
      # JEV_PROXY_URL 已退役（laya 自托管无 451 地域封锁），保留 passthrough 兼容旧 .env。
      JEV_PROXY_URL: ${JEV_PROXY_URL:-}
      # 超时预算：缺省与 app/config.py 默认值对齐（float 字段不接受空串，必须带值缺省）。
      JEV_TIMEOUT_SECONDS: ${JEV_TIMEOUT_SECONDS:-5.0}
      JEV_KB_TIMEOUT_SECONDS: ${JEV_KB_TIMEOUT_SECONDS:-2.0}
    expose: ["8000"]                       # 仅内部网络可见，不对宿主发布
    volumes:
      # 宿主机 bind mount（${VOLUMES_ROOT:-./volumes}）。首次部署（顺序执行）：
      #   mkdir -p volumes/backend volumes/docling volumes/tei
      #   cp -r backend/data/skills volumes/backend/skills   # 技能种子（一次性；bind
      #     mount 不像命名卷会自动拷镜像内种子，漏拷则种子技能缺失）
      #   sudo chown -R 1001:1001 volumes/backend volumes/docling  # 容器内 app uid=1001
      - ${VOLUMES_ROOT:-./volumes}/backend:/data
      # docling 模型（bind mount → 宿主机 volumes/docling/，artifacts/ + hf-cache/
      # 双布局，目录结构见 README「docling 模型目录与预下」）。runbook：
      # ① 预热（一次性，联网，与运行镜像同 docling 版本；产物直接落宿主机——
      #    layout/tableformer 取自 HF、RapidOCR 取自 ModelScope，故必须用容器内
      #    docling-tools 下载而非手动搬运；HF 下载默认走上方 HF_ENDPOINT 镜像，
      #    无梯子环境可直接执行）：
      #    docker compose run --rm --no-deps -e HF_HUB_OFFLINE=0 backend \
      #      docling-tools models download layout tableformer rapidocr -o /models/docling/artifacts
      # ② 冻结验证（断网复跑，失败信息会点名缺失仓库，按提示补
      #    `docling-tools models download-hf-repo <repo>` 后重跑）：
      #    上传一份真实 PDF 到任一知识库并 KB_PARSER_ENGINE=docling 重解析成功
      # ③ 运行期恒 HF_HUB_OFFLINE=1；docling 升级（requirements 版本变更）= 重跑 ①②
      - ${VOLUMES_ROOT:-./volumes}/docling:/models/docling
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped
    # GPU 声明（docker compose v2 本地部署即生效）：docling layout/TableFormer
    # 走 torch（cu124 wheel 自带 CUDA 运行时），与 tei 共占单卡（峰值 ~3-4G 显存）。
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ============ MCP 网关（goduck 自研）============
  mcp-servers:
    # 知识库检索网关（kb_search 工具，FastMCP http 传输，端点 /mcp/）。
    # ES/TEI/PG 均懒连接（工具调用时才建链）⇒ 无需 depends_on；PG 为只读
    # （kb → embedding 注册行解析，不可达自动回落 env）。
    # 部署后一次性注册（DB 表驱动，重启自动加载）：/settings/mcp 添加 HTTP server
    #   URL = http://mcp-servers:8088/mcp/（注册名任意，工具即 {name}__kb_search）
    build: ./mcp-servers
    image: goduck-mcp-servers:latest
    container_name: goduck-mcp-servers
    environment:
      ES_URL: http://elasticsearch:9200
      # 向量模型注册表（只读解析 kb→embedding；缺失/不可达回落 EMBEDDING_* env）
      DATABASE_URL: postgresql://${POSTGRES_USER:-goduck}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-langgraph_db}
      # EMBEDDING_* 为回落路径（注册行缺失/PG 不可达时用；与 backend 同值仅为回落一致性）
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://tei:8082/v1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-dummy}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embeddings-inference}
      EMBEDDING_CHECK_CTX_LENGTH: ${EMBEDDING_CHECK_CTX_LENGTH:-false}
      EMBEDDING_DIMS: ${EMBEDDING_DIMS:-512}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-24}
      KB_TOP_K: ${KB_TOP_K:-5}
    expose: ["8088"]                      # 仅内部网络，backend 经服务名访问
    restart: unless-stopped

  # ============ 前端 ============
  frontend:
    build: ./frontend
    image: goduck-frontend:latest
    container_name: goduck-frontend
    expose: ["80"]                         # 仅内部，由 nginx 转发
    restart: unless-stopped

  # ============ 边缘网关（唯一对外入口）============
  nginx:
    image: nginx:alpine
    container_name: goduck-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # basic auth 凭据（nginx.conf auth_basic）：部署前先生成（见 nginx/.htpasswd.example，
      # 已 gitignore）；文件缺失时 nginx 起不来——预期防呆，防裸奔上线。
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
    ports:
      - "${EDGE_PORT:-80}:80"              # 唯一对外端口
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  goduck_pgdata:
  goduck_miniodata:
  goduck_esdata:
