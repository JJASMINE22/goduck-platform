# goduck-platform 边缘反向代理（唯一对外入口）。
# 架构：LAN/浏览器 → nginx:80 → goduck-net 内各服务（前端/后端/管理工具）。
# 前端与后端都不直接发布端口，仅 nginx 发布 80（生产再加 443+TLS）。
#
# 关键点：
# 1) 前端发 /api/xxx；后端在根路径 /xxx 提供服务（与 vite proxy 同款剥离），故需 rewrite 剥 /api。
# 2) resolver 127.0.0.11 是 Docker 内置 DNS；配合"变量承载 upstream"，nginx 在某后端
#    尚未启动时也能正常启动，并在它起来后按 valid=30s 重新解析（适配多 compose 独立启动）。
# 3) /api 走 SSE 流式（/sessions/{id}/messages），必须 proxy_buffering off，否则实时性丢失。
# 4) /api/sessions/.../voice 是 WebSocket（语音输入）：需 Upgrade/Connection 透传 + 分钟级
#    读写超时（连接常驻、心跳保活）；SSE 路径不受 map 影响（非 upgrade 请求头无 Upgrade）。
# 5) 全站 basic auth（唯一门禁）：平台自身无登录体系，内网穿透 / 任何对外暴露前
#    必须启用。浏览器认证缓存会自动随同源 fetch/EventSource(SSE)/WebSocket 请求
#    附带 Authorization，前端零改动。凭据文件经 compose 挂载为 /etc/nginx/.htpasswd
#    （宿主机 nginx/.htpasswd，生成见 .htpasswd.example；缺失时 nginx 起不来，防裸奔）。

# WebSocket 升级映射：非 WS 请求（含 SSE）为空串 → Connection 头维持 ""（HTTP/1.1 keep-alive）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      "";
}

server {
    listen 80;
    server_name _;

    # ---- 全站 basic auth（唯一门禁，前端静态 + /api + SSE + WS 全覆盖）----
    # 平台自身无登录体系；内网/穿透远程访问共用此凭据。多用户 = 每行一个
    # `用户名:密码散列`。文件缺失时 nginx 起不来（属预期防呆）。
    auth_basic           "goduck-platform";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # 附件上传上限（ATTACHMENT_MAX_SIZE_MB=10，留余量）
    client_max_body_size 25m;

    # Docker 内置 DNS，动态解析 goduck-net 服务名
    resolver 127.0.0.11 valid=30s ipv6=off;

    # gzip 压缩静态资源
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # ---------- 后端 API：/api/* → backend:8000/*（剥离 /api）----------
    location /api/ {
        # 剥 /api 前缀：/api/sessions/x → /sessions/x（后端根路径路由）
        rewrite ^/api/(.*)$ /$1 break;

        set $backend http://backend:8000;
        proxy_pass $backend;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WS（语音 /voice）透传升级头；非 WS 请求 $http_upgrade 为空 → 头不生效
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # SSE 流式：关缓冲，否则消息会被攒批、实时性丢失
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---------- 前端：/ → frontend:80 ----------
    # 前端容器需以服务名 frontend 暴露 HTTP（如 nginx:alpine 服务 dist，含 SPA fallback）
    location / {
        set $frontend http://frontend:80;
        proxy_pass $frontend;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- [可选] pgAdmin 数据库管理：/pgadmin/ → pgadmin:80 ----------
    # pgAdmin 用 X-Script-Name 支持子路径部署；它内部用 postgres:5432 连库。
    # location /pgadmin/ {
    #     set $pgadmin http://pgadmin:80;
    #     proxy_pass $pgadmin;
    #     proxy_set_header X-Script-Name /pgadmin;
    #     proxy_set_header X-Scheme      $scheme;
    #     proxy_set_header Host          $host;
    #     proxy_redirect off;
    # }
}
