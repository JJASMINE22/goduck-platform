# goduck-platform 边缘反向代理（唯一对外入口）。
# 架构：LAN/浏览器 → nginx:80 → goduck-net 内各服务（前端/后端/管理工具）。
# 前端与后端都不直接发布端口，仅 nginx 发布 80（生产再加 443+TLS）。
#
# 关键点：
# 1) 前端发 /api/xxx；后端在根路径 /xxx 提供服务（与 vite proxy 同款剥离），故需 rewrite 剥 /api。
# 2) resolver 127.0.0.11 是 Docker 内置 DNS；配合"变量承载 upstream"，nginx 在某后端
#    尚未启动时也能正常启动，并在它起来后按 valid=30s 重新解析（适配多 compose 独立启动）。
# 3) /api 走 SSE 流式（/sessions/{id}/messages），必须 proxy_buffering off，否则实时性丢失。
# 4) /api/sessions/.../voice 是 WebSocket（语音输入）：需 Upgrade/Connection 透传 + 分钟级
#    读写超时（连接常驻、心跳保活）；SSE 路径不受 map 影响（非 upgrade 请求头无 Upgrade）。
# 5) 全站 basic auth（边缘门禁）：先于平台登录护住前端静态与 API 入口（纵深
#    防御；平台内另有登录体系，见 BOOTSTRAP_USERS。本地直连前后端开发时不经
#    本层）。浏览器认证缓存会自动随同源 fetch/EventSource(SSE)/WebSocket 请求
#    附带 Authorization，前端零改动。凭据文件经 compose 挂载为 /etc/nginx/.htpasswd
#    （宿主机 nginx/.htpasswd，生成见 .htpasswd.example；缺失时 nginx 起不来，防裸奔）。

# WebSocket 升级映射：非 WS 请求（含 SSE）为空串 → Connection 头维持 ""（HTTP/1.1 keep-alive）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      "";
}

server {
    listen 80;
    server_name _;

    # ---- 全站 basic auth（边缘门禁，前端静态 + /api + SSE + WS 全覆盖）----
    # 先于平台登录护住全部入口（纵深防御）。多用户 = 每行一个 `用户名:密码散列`。
    # 文件缺失时 nginx 起不来（属预期防呆）。
    auth_basic           "goduck-platform";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # 附件上传传输层护栏：须 ≥ 后端 ATTACHMENT_MAX_SIZE_MB（会话附件与 KB 文档
    # 共用该值，.env 可调；2G 文件 + multipart 开销取 2100m）。超过此值由 nginx
    # 直接 413（裸 HTML），超过后端限额由 FastAPI 返回友好 413 文案。
    client_max_body_size 2100m;

    # Docker 内置 DNS，动态解析 goduck-net 服务名
    resolver 127.0.0.11 valid=30s ipv6=off;

    # gzip 压缩静态资源
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # ---------- 后端 API：/api/* → backend:8000/*（剥离 /api）----------
    location /api/ {
        # 先 set 后 rewrite-break：break 标志会终止后续 rewrite 模块指令（set 同属
        # 该模块），顺序颠倒将导致 $backend 未赋值 → proxy_pass 空串 → 500。
        set $backend http://backend:8000;

        # 剥 /api 前缀：/api/sessions/x → /sessions/x（后端根路径路由）
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WS（语音 /voice）透传升级头；非 WS 请求 $http_upgrade 为空 → 头不生效
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # SSE 流式：关缓冲，否则消息会被攒批、实时性丢失
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---------- .mjs 模块脚本 MIME（PDF.js worker 等）----------
    # nginx:alpine 1.27 的 mime.types 无 mjs 条目 → octet-stream 下发，浏览器
    # 拒绝作模块脚本执行（"Failed to fetch dynamically imported module"）。
    # 上游（frontend 容器 nginx）同样不识 mjs 会带 octet-stream 头——隐藏之
    # 并显式注入正确 MIME（代理响应不适用 default_type/types，只能 add_header
    # 强设）。空 types{} 仅清本 location 继承映射；代理配置复制自 location /
    # （正则 location 优先级高于前缀 location）。
    location ~* \.mjs$ {
        types { }
        proxy_hide_header Content-Type;
        # 同步抹掉校验头：文件未变时上游仍回 304，浏览器会沿用缓存的旧响应头
        # （octet-stream 时代的模块失败被固化）；去校验器强制无条件 200 换新头
        proxy_hide_header ETag;
        proxy_hide_header Last-Modified;
        # 请求侧同样抹掉校验头：否则浏览器带 If-None-Match → 上游 304 透传 →
        # 中毒缓存（octet-stream）被沿用。双侧抹净 = 无条件 200 全量 + 本层
        # 注入的正确 MIME，一次普通刷新即覆写所有已中毒的浏览器缓存。
        proxy_set_header If-None-Match "";
        proxy_set_header If-Modified-Since "";
        add_header Content-Type application/javascript always;
        set $frontend_mjs http://frontend:80;
        proxy_pass $frontend_mjs;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- MinIO 同源代理（预签名 URL 相对化）----------
    # backend 预签名的 SigV4 以内部端点 minio:9000 计算 Host；代理保持该 Host
    # 头 → 签名校验不受影响，浏览器仅需同源可达（任意访问域名下均成立，不外
    # 泄内网地址）。set 先于 rewrite-break（同 /api/ 教训）；关缓冲保 PDF.js Range
    # 按页取流。
    location /minio/ {
        set $minio http://minio:9000;
        rewrite ^/minio/(.*)$ /$1 break;
        proxy_pass $minio;
        proxy_http_version 1.1;
        proxy_set_header Host minio:9000;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # ---------- 前端：/ → frontend:80 ----------
    # 前端容器需以服务名 frontend 暴露 HTTP（如 nginx:alpine 服务 dist，含 SPA fallback）
    location / {
        set $frontend http://frontend:80;
        proxy_pass $frontend;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- [可选] pgAdmin 数据库管理：/pgadmin/ → pgadmin:80 ----------
    # pgAdmin 用 X-Script-Name 支持子路径部署；它内部用 postgres:5432 连库。
    # location /pgadmin/ {
    #     set $pgadmin http://pgadmin:80;
    #     proxy_pass $pgadmin;
    #     proxy_set_header X-Script-Name /pgadmin;
    #     proxy_set_header X-Scheme      $scheme;
    #     proxy_set_header Host          $host;
    #     proxy_redirect off;
    # }
}
