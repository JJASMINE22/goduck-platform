[project]
name = "goduck-platform"
version = "0.1.0"
description = "Agent orchestration / session / management platform"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "langchain>=0.3",
    "langchain-openai>=0.2",
    "langchain-mcp-adapters>=0.1",
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=2.0",
    # Jev (TypeSafe System One) 官方 LangChain 集成：shell 守卫传输层
    # (TypeSafeClassifier)。0.0.1a3 为预发布，上界 <0.0.2 防 alpha API 漂移
    # （与 jev-1.13.0 锁版本的同一精神）；传递引入 httpx2（pydantic 出品的
    # 新一代 HTTP 客户端），与既有 httpx 并存、互不干涉。
    "langchain-typesafe>=0.0.1a3,<0.0.2",
    "deepagents>=0.7",
    "fastmcp>=2.0",
    "tavily-python>=0.5",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "requests>=2.32",
    "minio>=7.2",
    "filetype>=1.2",
    "python-docx>=1.1",
    "pymupdf>=1.24",
    # 打印件 PDF（无文本层扫描件）OCR 兜底：PP-OCRv4 ONNX 模型，纯 pip 安装、
    # CPU 推理、中文友好（知识库入库链 pdf_ocr.py）
    "rapidocr-onnxruntime>=1.3",
    # 知识库 docling 解析路径（plan: kb-docling-parse-display）：layout +
    # TableFormer + RapidOCR(lang=["ch"])；锁 >=2.130,<3 防 API 漂移，升级须
    # 重跑 Phase A 验收（真 docling 冒烟见 scripts/smoke_docling_adapter.py，
    # 2.135.0 实测通过）。软依赖：未安装时 kb_parser_engine=docling 的入库
    # 显式 failed（提示安装），默认 legacy 路径不受影响。
    "docling[rapidocr]>=2.130,<3",
    # docling 2.135 读取 rapidocr.utils.model_resolver.PP_OCRV6_LANGS，该符号
    # 在 3.10.0 被移走（docling 自身约束 <4 过宽）——上界收紧至实测兼容。
    # 与 legacy 路径的 rapidocr-onnxruntime（独立包）并存不冲突。
    "rapidocr>=3.9.1,<3.10",
    # 语言检测（docling 单元 lang 元数据，软依赖：缺位置 None）
    "langdetect>=1.0.9",
    "websockets>=13",
    # 登录认证：argon2id 密码哈希（app_user.password_hash）
    "argon2-cffi>=23.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.6",
]
quickjs = [
    "langchain-quickjs>=0.2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
# 显式锁定历史默认规则集：ruff 0.13+ 起默认集大幅扩张（UP/BLE/S1xx 等），
# 不锁定会使同一份代码的门禁结果随 ruff 版本漂移。收紧规则请在此显式追加。
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
