[project]
name = "goduck-platform"
version = "0.1.0"
description = "Agent orchestration / session / management platform"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "langchain>=0.3",
    "langchain-openai>=0.2",
    "langchain-mcp-adapters>=0.1",
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=2.0",
    "deepagents>=0.7",
    "fastmcp>=2.0",
    "tavily-python>=0.5",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "requests>=2.32",
    "minio>=7.2",
    "filetype>=1.2",
    "python-docx>=1.1",
    "pymupdf>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.6",
]
quickjs = [
    "langchain-quickjs>=0.2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
